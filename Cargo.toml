[workspace]
resolver = "2"
members = ["kaniran-core"]
# Future siblings (kaniran-cli, kaniran-demo, ...) get added to `members`.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidrideout/kaniran"

[workspace.dependencies]
lexpr = "0.2"
serde-lexpr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.18"
similar = "2"
