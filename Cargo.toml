[workspace]
resolver = "2"
members = ["kaniran-core"]
# Future siblings (kaniran-cli, kaniran-demo, ...) get added to `members`.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidrideout/kaniran"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.18"
similar = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
config = "0.14"
thiserror = "2"
unicode-properties = "0.1"

# Release-with-debug profile for sampling profilers (samply, pprof).
# Build with `cargo build --profile profiling --bin <name>`.
[profile.profiling]
inherits = "release"
debug = true
