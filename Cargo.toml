[workspace]
resolver = "2"
members = ["kaniran-core", "kaniran-cli", "kaniran-audit"]
# Future siblings (kaniran-demo, ...) get added to `members`.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/davidrideout/kaniran"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.18"
similar = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
config = "0.14"
thiserror = "2"
rkyv = "0.8"
memmap2 = "0.9"
futures-util = "0.3"
mimalloc = "0.1"
unicode-properties = "0.1"
roxmltree = "0.21"
indexmap = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release-with-debug profile for sampling profilers (samply, pprof).
# Build with `cargo build --profile profiling --bin <name>`.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Fast-compile near-release profile for test/audit iteration. Keeps
# opt-level 3 (DB replay crawls under `dev`) but drops the expensive
# whole-program steps — fat LTO, single codegen unit, strip — and turns
# incremental back on, so edit-rebuild cycles take seconds instead of
# minutes. Use `cargo build --profile testing --bin <name>` or
# `cargo test --profile testing`; artifacts land in target/testing/.
[profile.testing]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = "none"
incremental = true
