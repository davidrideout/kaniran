[package]
name = "kaniran-core"
description = "Rust port of ichiran (Japanese morphology / segmentation / romanization). Core library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fancy-regex = { workspace = true }
similar = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
unicode-properties = { workspace = true }
parquet = "55"
arrow = "55"
futures = "0.3"
pprof = { version = "0.13", features = ["flamegraph"] }

# Per-FQN fixture-replay runners. Each lives at audit/<pkg>/<fqn>_test.rs
# mirroring src/<pkg>/<fqn>.rs. Run manually with:
#   cargo run --bin <fqn>_test -- --path corpus/<corpus_tag>/<fqn>.parquet
