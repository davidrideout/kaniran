[package]
name = "kaniran-core"
description = "Rust port of ichiran (Japanese morphology / segmentation / romanization). Core library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fancy-regex = { workspace = true }
similar = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
parquet = "55"
arrow = "55"
futures = "0.3"

# Per-FQN fixture-replay runners. Each lives at audit/<pkg>/<fqn>_test.rs
# mirroring src/<pkg>/<fqn>.rs. Run manually with:
#   cargo run --bin <fqn>_test -- --path corpus/<corpus_tag>/<fqn>.parquet
[[bin]]
name = "get_split_test"
path = "audit/dict/get_split_test.rs"

[[bin]]
name = "normalize_test"
path = "audit/characters/normalize_test.rs"

[[bin]]
name = "seq_test"
path = "audit/dict/seq_test.rs"

[[bin]]
name = "common_test"
path = "audit/dict/common_test.rs"

[[bin]]
name = "source_test"
path = "audit/dict/source_test.rs"

[[bin]]
name = "get_text_test"
path = "audit/dict/get_text_test.rs"

[[bin]]
name = "find_word_test"
path = "audit/dict/find_word_test.rs"

[[bin]]
name = "find_word_as_hiragana_test"
path = "audit/dict/find_word_as_hiragana_test.rs"

[[bin]]
name = "get_original_text_test"
path = "audit/dict/get_original_text_test.rs"

[[bin]]
name = "query_parents_kanji_test"
path = "audit/dict/query_parents_kanji_test.rs"

[[bin]]
name = "best_kana_conj_test"
path = "audit/dict/best_kana_conj_test.rs"

[[bin]]
name = "query_parents_kana_test"
path = "audit/dict/query_parents_kana_test.rs"

[[bin]]
name = "best_kanji_conj_test"
path = "audit/dict/best_kanji_conj_test.rs"

[[bin]]
name = "get_kanji_test"
path = "audit/dict/get_kanji_test.rs"
