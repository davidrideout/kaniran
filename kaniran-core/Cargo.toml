[package]
name = "kaniran-core"
description = "Rust port of ichiran (Japanese morphology / segmentation / romanization). Core library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The rkyv-backed dictionary store: adds rkyv derives to the DAO row
# structs and enables `conn::kani_snapshot` + `conn::kani_rkyv_backend`
# (selected at runtime via KANI_RKYV_SNAPSHOT). Off by default — the
# Postgres-only build never pays for it.
rkyv = ["dep:rkyv", "dep:memmap2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fancy-regex = { workspace = true }
similar = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
unicode-properties = { workspace = true }
roxmltree = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
