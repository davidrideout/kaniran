[package]
name = "kaniran-core"
description = "Rust port of ichiran (Japanese morphology / segmentation / romanization). Core library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["rkyv"]
# The rkyv-backed dictionary store — the default runtime backend. Reads
# every lookup from a memory-mapped archive
# (DATABASE_URL=memory://<archive path>), so the default build is
# synchronous and never links sqlx or tokio.
rkyv = ["dep:rkyv", "dep:memmap2"]
# Optional Postgres backend, runtime-swappable with rkyv
# (DATABASE_URL=postgres://...). Pulls in sqlx + tokio; the Postgres
# queries run synchronously by blocking on a private tokio runtime.
postgres = ["dep:sqlx", "dep:tokio"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fancy-regex = { workspace = true }
similar = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
config = { workspace = true }
thiserror = { workspace = true }
unicode-properties = { workspace = true }
roxmltree = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
