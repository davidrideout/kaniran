<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kaniran — Japanese reader{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">kaniran <span aria-hidden="true">🦀</span></div>
    <nav class="nav"><a href="/" class="active">Reader</a></nav>
    <div class="tagline">paste Japanese — read it annotated</div>
  </header>

  {% block content %}{% endblock %}

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
