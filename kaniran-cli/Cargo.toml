[package]
name = "kaniran-cli"
description = "Rust transliteration of ichiran's command-line interface (ichiran/cli)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Builds the optional `kaniran-rkyv-dumper` binary.
rkyv-dump = ["kaniran-core/rkyv", "dep:rkyv", "dep:futures-util"]

[[bin]]
name = "kaniran-cli"
path = "src/main.rs"

[[bin]]
name = "kaniran-rkyv-dumper"
path = "src/bin/kaniran_rkyv_dumper.rs"
required-features = ["rkyv-dump"]

[dependencies]
kaniran-core = { path = "../kaniran-core" }
mimalloc = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
rkyv = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
